name: One-time import of the original PWA icon PNGs
on:
  push:
    paths:
      - .github/workflows/import-original-icons.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy original binary icons from preserved release
        run: |
          set -euo pipefail
          git remote add preserved-release https://github.com/shreyammm/e-rate.git
          git fetch --depth=1 preserved-release refs/heads/memory-grove-release-1-2
          git checkout FETCH_HEAD -- assets/icon-192.png assets/icon-512.png assets/icon-apple.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png assets/icon-apple.png
          if git diff --cached --quiet; then
            echo "All original icons are already present."
            exit 0
          fi
          git commit -m "Restore original PWA install icons from preserved Memory Grove release"
          git push origin HEAD:main
